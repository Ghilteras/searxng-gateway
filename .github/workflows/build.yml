name: Build and Push

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Format check
        run: |
          out="$(gofmt -l .)" || exit 1
          test -z "$out" || { echo "Files need formatting:"; echo "$out"; exit 1; }

      - name: Test
        run: go test -race -count=1 ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v7.0.1
        with:
          version: v2.1.6
          install-mode: goinstall

  build:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    # Every push to main produces a released artefact derived from the commit CI
    # just built. No human cuts a tag, and there is no moment at which main is
    # ahead of the newest release: that is the drift that left v3.2.1..v3.2.5
    # with no Release object while releases/latest answered v3.1.0.
    #
    # The job runs only after `test` and `build` succeed, so a tag can never
    # point at a commit whose image was not produced. Notes are the commit
    # subjects since the previous tag: this repository commits straight to main
    # with no pull requests, so GitHub's native --generate-notes has no PR list
    # and would emit an almost empty body.
    needs: [test, build]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve the version and tag the built commit
        id: ver
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            tag="${GITHUB_REF_NAME}"
          else
            latest=$(git tag --list 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n1 || true)
            if [ -z "${latest:-}" ]; then
              tag="v0.1.0"
            else
              rest="${latest#v}"
              major="${rest%%.*}"
              rest="${rest#*.}"
              minor="${rest%%.*}"
              patch="${rest#*.}"
              tag="v${major}.${minor}.$((patch + 1))"
            fi
            if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
              echo "::error::tag $tag already exists; refusing to reuse a version"
              exit 1
            fi
            git tag "$tag" "$GITHUB_SHA"
            git push origin "refs/tags/$tag"
          fi
          prev=$(git tag --list 'v*' --sort=-v:refname | grep -vx "$tag" | head -n1 || true)
          {
            echo "tag=$tag"
            echo "prev=${prev:-}"
          } >> "$GITHUB_OUTPUT"
          echo "resolved tag=$tag prev=${prev:-none}"

      - name: Build the release body from commits since the previous tag
        env:
          TAG: ${{ steps.ver.outputs.tag }}
          PREV: ${{ steps.ver.outputs.prev }}
        run: |
          set -euo pipefail
          if [ -n "${PREV:-}" ]; then
            range="$PREV..$TAG"
            heading="## What changed since $PREV"
            link="**Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${PREV}...${TAG}"
          else
            range="$TAG"
            heading="## Initial release"
            link=""
          fi
          {
            printf '%s\n\n' "$heading"
            git log --no-merges --pretty=format:'- %s' "$range" | grep -v '^$' || true
            printf '\n'
            if [ -n "$link" ]; then
              printf '\n%s\n' "$link"
            fi
          } > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $TAG already exists - nothing to do"
            exit 0
          fi
          gh release create "$TAG" -R "$GITHUB_REPOSITORY" --verify-tag \
            --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
