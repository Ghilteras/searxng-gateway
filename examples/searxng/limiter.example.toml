# Example bot detection config. Adjust IP ranges to your network.

[botdetection]

# Docker container network where your reverse proxy and SearXNG live.
# Required so SearXNG can extract the real client IP
# from the X-Forwarded-For header set by your reverse proxy.
trusted_proxies = [
  '127.0.0.0/8',
  '::1',
  '172.20.0.0/16  # Docker default bridge; replace with your container network',
]

[botdetection.ip_lists]

# LAN — unlimited access
pass_ip = [
  '192.168.1.0/24  # your LAN subnet',
  '172.20.0.0/16  # Docker default bridge; replace with your container network',
]
